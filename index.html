<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bunny81</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f6f2;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 32px 12px;
    }

    .brand {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 32px 28px;
    }

    .featured-art {
      display: block;
      width: min(100%, 900px);
      text-decoration: none;
      color: inherit;
    }

    .featured-art img {
      display: block;
      width: 100%;
      max-height: 68vh;
      object-fit: contain;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px 28px;
      padding: 18px 24px 28px;
      font-size: 0.9rem;
    }

    nav a {
      color: inherit;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 18px 8px;
      }

      main {
        padding: 10px 18px 20px;
      }

      .featured-art img {
        max-height: 65vh;
      }

      nav {
        gap: 10px 18px;
        padding: 14px 18px 22px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <h1 class="brand">Bunny81</h1>
    </header>

    <main>
      <a class="featured-art" id="featured-link" href="#">
        <img
          id="featured-image"
          src="AtlantaHotelRooster-04.jpeg"
          alt="Atlanta Hotel Rooster linocut print"
        >
      </a>
    </main>

    <nav>
      <a href="#">Gallery</a>
      <a href="#">Surface Patterns</a>
      <a href="#">Gift Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

  </div>

  <script>
    const artworks = [
      {
        image: "AtlantaHotelRooster-04.jpeg",
        alt: "Atlanta Hotel Rooster linocut print",
        link: "#"
      }
    ];

    const artwork =
      artworks[Math.floor(Math.random() * artworks.length)];

    document.getElementById("featured-image").src = artwork.image;
    document.getElementById("featured-image").alt = artwork.alt;
    document.getElementById("featured-link").href = artwork.link;
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bunny81</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f6f2;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 32px 36px 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 28px;
    }

    .artwork-link {
      display: block;
      text-decoration: none;
    }

    .artwork {
      display: block;
      max-width: min(72vw, 720px);
      max-height: 68vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 28px;
      padding: 18px 24px 32px;
    }

    nav a {
      color: #171717;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 20px 8px;
      }

      main {
        padding: 12px 18px;
      }

      .artwork {
        max-width: 88vw;
        max-height: 66vh;
      }

      nav {
        gap: 16px 22px;
        padding: 14px 18px 24px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <h1>Bunny81</h1>
    </header>

    <main>
      <a id="artwork-link" class="artwork-link" href="#">
        <img id="featured-artwork" class="artwork" src="" alt="">
      </a>
    </main>

    <nav>
      <a href="#">Gallery</a>
      <a href="#">Surface Patterns</a>
      <a href="#">Gift Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

  </div>

  <script>
    const artworks = [
      {
        image: "AtlantaHotelRooster-04.jpeg",
        alt: "Atlanta Hotel Rooster linocut print",
        link: "#"
      },
      {
        image: "Flower on Cardstock.jpg",
        alt: "Hand-carved flower print",
        link: "#"
      },
      {
        image: "Traveler Rabbit on packing paper.jpg",
        alt: "Traveler Rabbit hand-printed on salvaged packing paper",
        link: "#"
      }
    ];

    const choice = artworks[Math.floor(Math.random() * artworks.length)];

    document.getElementById("featured-artwork").src = choice.image;
    document.getElementById("featured-artwork").alt = choice.alt;
    document.getElementById("artwork-link").href = choice.link;
  </script>

</body>
</html>

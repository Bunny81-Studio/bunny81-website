<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bunny81</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #f7f6f2;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 28px 32px 22px;
    }

    header {
      flex: 0 0 auto;
    }

    .brand {
      display: inline-block;
      color: #171717;
      text-decoration: none;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .art-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 0;
    }

    .featured-art {
      display: flex;
      width: min(100%, 1100px);
      height: min(68vh, 720px);
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .featured-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    nav {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(18px, 4vw, 54px);
      flex-wrap: wrap;
      padding-top: 8px;
    }

    nav a {
      color: #171717;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    nav a:hover,
    nav a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 20px 18px 18px;
      }

      .brand {
        font-size: 20px;
      }

      .art-stage {
        padding: 22px 0;
      }

      .featured-art {
        height: 62vh;
      }

      nav {
        gap: 14px 22px;
      }

      nav a {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <a class="brand" href="index.html">Bunny81</a>
    </header>

    <main class="art-stage">
      <a class="featured-art" href="#" aria-label="View Atlanta Hotel Rooster">
        <img
          src="AtlantaHotelRooster-04.jpeg"
          alt="Atlanta Hotel Rooster, hand-carved and hand-printed linocut by Bunny81"
        >
      </a>
    </main>

    <nav aria-label="Main navigation">
      <a href="#">Gallery</a>
      <a href="#">Surface Patterns</a>
      <a href="#">Gift Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunny81</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f6f2;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 26px 28px 22px;
    }

    header {
      text-align: center;
      flex: 0 0 auto;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 0;
    }

    .artwork-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(100%, 1100px);
      height: min(68vh, 720px);
    }

    .artwork {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }

    nav {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(18px, 4vw, 54px);
      flex-wrap: wrap;
      padding-top: 8px;
    }

    nav a {
      color: #171717;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover,
    nav a:focus {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 20px 18px 18px;
      }

      .brand {
        font-size: 20px;
      }

      main {
        padding: 18px 0;
      }

      .artwork-link {
        height: 62vh;
      }

      nav {
        gap: 14px 22px;
      }

      nav a {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <a class="brand" href="index.html">Bunny81</a>
    </header>

    <main>
      <a id="artwork-link" class="artwork-link" href="#">
        <img id="featured-artwork" class="artwork" src="" alt="">
      </a>
    </main>

    <nav aria-label="Main navigation">
      <a href="gallery.html">Gallery</a>
      <a href="#">Surface Patterns</a>
      <a href="#">Gift Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

  </div>

  <script>
    const artworks = [
      {
        image: "AtlantaHotelRooster-04.jpeg",
        alt: "Atlanta Hotel Rooster linocut print",
        link: "atlanta-hotel-rooster.html"
      },
      {
        image: "Flower on Cardstock.jpg",
        alt: "Hand-carved flower print",
        link: "flower.html"
      },
      {
        image: "Traveler Rabbit on packing paper.jpg",
        alt: "Traveler Rabbit hand-printed on salvaged packing paper",
        link: "traveler-rabbit.html"
      }
    ];

    const choice = artworks[Math.floor(Math.random() * artworks.length)];

    document.getElementById("featured-artwork").src = choice.image;
    document.getElementById("featured-artwork").alt = choice.alt;
    document.getElementById("artwork-link").href = choice.link;
  </script>

</body>
</html>

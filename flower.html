<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower — Bunny81</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f6f2;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 26px 28px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 45px;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 22px;
      letter-spacing: 0.03em;
    }

    main {
      max-width: 1050px;
      margin: 0 auto;
    }

    .artwork {
      display: block;
      max-width: 100%;
      max-height: 70vh;
      width: auto;
      height: auto;
      margin: 0 auto 34px;
    }

    .details {
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 500;
    }

    p {
      margin: 5px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .back {
      display: inline-block;
      margin-top: 28px;
      color: #171717;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <a class="brand" href="index.html">Bunny81</a>
    </header>

    <main>
      <img
        class="artwork"
        src="Flower on cardstock.jpg"
        alt="Hand-Carved Flower Print"
      >

      <div class="details">
        <h1>Flower</h1>
        <p>Linocut</p>
        <p>Hand printed on cardstock</p>

        <a class="back" href="index.html">← Back</a>
      </div>
    </main>

  </div>
</body>
</html>
